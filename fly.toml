app = "church-ms-backend"
primary_region = "ams"

[build]

[env]
  TRUST_PROXY = "1"
  RATE_LIMIT_MAX = "600"

[[files]]
  guest_path = "/app/secure/google-oauth-client.json"
  secret_name = "GOOGLE_OAUTH_CLIENT_JSON_B64"

[[files]]
  guest_path = "/app/secure/google-oauth-token.json"
  secret_name = "GOOGLE_OAUTH_TOKEN_JSON_B64"

[http_service]
  internal_port = 5000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

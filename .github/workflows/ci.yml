name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test & security scan (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']

    env:
      NODE_ENV: test
      # No provider credentials are available to CI, and none are needed:
      # every AI test uses mocked adapters. AI stays off so a missing key can
      # never be mistaken for a passing integration.
      AI_ENABLED: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `test:security` = secret scan followed by the full Jest run with
      # coverage thresholds. It is the single gate for this repo.
      - name: Run secret scan and test suite
        run: npm run test:security

      # Real-MongoDB suites. On a Linux runner `mongodb-memory-server` spawns
      # its own mongod, so no service container and no MONGO_TEST_URI is needed.
      - name: Run integration tests
        run: npm run test:integration

      - name: Verify coverage artifacts are non-empty
        run: |
          set -euo pipefail
          for f in coverage/lcov.info coverage/coverage-summary.json; do
            if [ ! -s "$f" ]; then
              echo "::error::$f is missing or empty — coverage instrumentation is broken."
              exit 1
            fi
          done
          node -e "
            const s = require('./coverage/coverage-summary.json').total;
            console.log('statements', s.statements.pct + '%');
            console.log('branches  ', s.branches.pct + '%');
            console.log('functions ', s.functions.pct + '%');
            console.log('lines     ', s.lines.pct + '%');
            if (s.statements.total === 0) {
              console.error('No statements were instrumented.');
              process.exit(1);
            }
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/
          retention-days: 14

      - name: Check for whitespace errors
        run: git diff --check HEAD
